
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Fifth Bloom</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <main class="login-container">

        <img src="./assets/ChatGPT Image 9 de mai. de 2026, 11_34_20-Photoroom 1.svg" class="logo" alt="Fifth Bloom">

        <section class="login-box">
            <h1>Olá!</h1>
            <p>Para continuar, digite seu e-mail</p>

            <form id="loginForm">
                <input
                    type="email"
                    id="email"
                    placeholder="Email*"
                    required
                >

                <a href="#" class="forgot">Esqueci meu e-mail</a>

                <button type="submit" class="continue">
                    Continuar
                </button>
            </form>

            <div class="separator">
                <span></span>
                ou utilize sua conta
                <span></span>
            </div>

            <button class="google-button" type="button">
                <img src="https://www.google.com/favicon.ico" alt="">
                Google
            </button>

            <small>
                Protegido por reCAPTCHA -
                <a href="#">Privacidade</a> |
                <a href="#">Condições</a>
            </small>
        </section>

    </main>

    <script src="login.js"></script>
</body>
</html>
